services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catatan_harian
    ports:
      - "5432:5432"
    volumes:
      - catatan_harian_data:/var/lib/postgresql/data

volumes:
  catatan_harian_data:
